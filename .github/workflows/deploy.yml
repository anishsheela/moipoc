name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/deploy_key

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            . anish@77.90.40.64:/var/www/moidemo.authentiverse.net/

      - name: Remove SSH key
        if: always()
        run: rm -f /tmp/deploy_key
